name: AWS Deploy

# Manual deploy: Actions → AWS Deploy → Run workflow
# Requires repo variable ENABLE_AWS_DEPLOY=true and secret AWS_DEPLOY_ROLE_ARN
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: fleetguard-backend
  APPRUNNER_STACK: fleetguard-apprunner

jobs:
  deploy-path-b:
    runs-on: ubuntu-latest
    if: vars.ENABLE_AWS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-fleetguard-${{ github.run_id }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} \
            || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy App Runner stack
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/apprunner/template.yaml \
            --stack-name ${{ env.APPRUNNER_STACK }} \
            --parameter-overrides \
              ImageUri="$IMAGE_URI" \
              ServiceName=${{ env.ECR_REPOSITORY }} \
              EcrRepositoryName=${{ env.ECR_REPOSITORY }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: App Runner service URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.APPRUNNER_STACK }} \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }}

  deploy-path-a:
    runs-on: ubuntu-latest
    needs: deploy-path-b
    if: vars.ENABLE_AWS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-fleetguard-${{ github.run_id }}

      - uses: aws-actions/setup-sam@v2

      - name: SAM build and deploy
        working-directory: infrastructure/sam
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name fleetguard-path-a \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides BedrockModelId="us.anthropic.claude-opus-4-6-v1"

      - name: Train and upload model artifacts to S3
        run: |
          pip install scikit-learn==1.5.2 numpy==1.26.4 pandas boto3
          python ml/scripts/train.py
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name fleetguard-path-a \
            --query "Stacks[0].Outputs[?OutputKey=='ModelBucketName'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})
          chmod +x infrastructure/scripts/upload_models.sh
          ./infrastructure/scripts/upload_models.sh "$BUCKET" fleetguard-model ${{ env.AWS_REGION }}

      - name: Path A API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name fleetguard-path-a \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }}
