name: AWS Deploy

# Manual deploy only until AWS OIDC + secrets are configured.
# To re-enable auto-deploy on push to main, uncomment the push block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-path-a:
    runs-on: ubuntu-latest
    # Extra gate: set repo variable ENABLE_AWS_DEPLOY=true to allow runs (Actions → Variables).
    if: vars.ENABLE_AWS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: SAM build and deploy
        working-directory: infrastructure/sam
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name fleetguard-path-a \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Upload model artifacts to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name fleetguard-path-a \
            --query "Stacks[0].Outputs[?OutputKey=='ModelBucketName'].OutputValue" \
            --output text)
          chmod +x infrastructure/scripts/upload_models.sh
          ./infrastructure/scripts/upload_models.sh "$BUCKET"

  deploy-path-b:
    runs-on: ubuntu-latest
    needs: deploy-path-a
    if: vars.ENABLE_AWS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: fleetguard-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: App Runner note
        run: |
          echo "Update App Runner service to use latest ECR image tag, or wire apprunner update-service in a follow-up step."
